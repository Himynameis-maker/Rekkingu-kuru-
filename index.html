<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rerikuru</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="stage-wrap">
  <canvas id="screen" width="256" height="216"></canvas>
  <div id="errors" class="errors" hidden></div>
  <div class="bar">
    <span id="status"></span>
    <button id="btn-grid" type="button">グリッド表示 (G)</button>
  </div>
</main>

<!-- 起動に失敗したとき、理由を画面に出す（真っ暗のままにしない） -->
<script>
(function () {
  function show(msg) {
    var e = document.getElementById('errors');
    if (!e) return;
    e.hidden = false;
    e.textContent += msg + '\n';
  }
  window.addEventListener('error', function (ev) {
    var t = ev.target;
    if (t && t.tagName === 'SCRIPT') show('読み込み失敗: ' + t.getAttribute('src'));
    else show('エラー: ' + ev.message + ' (' + String(ev.filename || '').split('/').pop() + ':' + ev.lineno + ')');
  }, true);
  window.addEventListener('load', function () {
    if (!(window.RK && window.RK.booted)) show('起動できていません。index.html と js / css フォルダを同じ場所に置いて、ブラウザで index.html を直接開いてください。');
  });
})();
</script>

<!-- 読み込み順が依存順。file:// で直接開けるよう ES Modules は使わない（context.md 参照） -->
<script src="js/config.js"></script>
<script src="js/stage/symbols.js"></script>
<script src="js/stage/stage.js"></script>
<script src="js/data/stages/stage01.js"></script>
<script src="js/render/screen.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
